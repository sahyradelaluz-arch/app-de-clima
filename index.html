<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App del Clima - API</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>
        <img src="banner.png" alt="Banner de la App del Clima" class="banner">

        <h1>🌤️ App del Clima</h1>
        <p>Consulta el clima en tiempo real de cualquier ciudad</p>
    </header>
    <h2>Historial de búsquedas</h2>

<div id="historial"></div>

    <main>
        <button id="btnUbicacion">📍 Usar mi ubicación</button>

        <form id="formulario" class="buscador">
            <input 
                type="text" 
                id="inputCiudad" 
                placeholder="Escribe una ciudad..."
                required
            >

            <button type="submit">🔍 Consultar</button>
            <h2>Pronóstico de 5 días</h2>
            <div id="pronostico" class="pronostico"></div>
        </form>

        <div id="resultado" class="resultado"></div>

        <p id="estado"></p>

    </main>

    <footer>
        <p>&copy; 2026 - App del Clima | Datos de OpenWeatherMap</p>
        <p>Banner diseñado en Canva ☁️</p>
    </footer>

    <button id="btnTema">🌙 Cambiar tema</button>
    <button id="btnWhatsApp">📱 Compartir en WhatsApp</button>

    <script src="script.js"></script>
</body>
</html>
